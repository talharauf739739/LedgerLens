[project]
name = "ledgerlens"
version = "0.1.0"
description = "Grounded, validated document intelligence for fintech. Every extracted number has a receipt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "azure-storage-blob>=12.31.1",
    "azure-storage-queue>=12.18.1",
    "fastapi>=0.165.0",
    "foundry-local-sdk>=2.5.0",
    "httpx>=0.28.1",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "redis>=8.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "UP046",  # pydantic generics read more clearly with Generic[T]
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"synth/**" = ["S311"]  # seeded RNG for reproducible fake data, not crypto

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["foundry_local.*", "reportlab.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs docker compose services running"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "faker>=40.63.0",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
]
