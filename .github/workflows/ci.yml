name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ledgerlens
      - run: uv run pytest
      - name: License check (fail on GPL/AGPL/SSPL)
        run: |
          uv run pip-licenses --partial-match \
            --fail-on="GNU General Public License;GNU Affero General Public License;Server Side Public License;GPLv;AGPL;SSPL"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    needs: lint-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledgerlens
          POSTGRES_PASSWORD: ledgerlens
          POSTGRES_DB: ledgerlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerlens" --health-interval 5s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration
      - run: uv run alembic downgrade base
