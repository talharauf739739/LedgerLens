<text x="996" y="152" font-size="11" font-weight="normal" fill="#64748B" text-anchor="start">one interface, OpenAI-compatible</text>
<rect x="996" y="168" width="228" height="50" rx="10" fill="#F4F5F7" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1010" y="191" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">PII masking</text>
<text x="1010" y="209" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">Presidio, before any cloud call</text>
<rect x="996" y="236" width="228" height="50" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="1010" y="259" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Foundry Local</text>
<text x="1010" y="277" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">laptop, port auto-discovered</text>
<rect x="996" y="298" width="228" height="50" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="1010" y="321" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Ollama</text>
<text x="1010" y="339" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">Linux VM, Kaggle GPU</text>
<rect x="996" y="360" width="228" height="50" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="1010" y="383" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Azure AI Foundry</text>
<text x="1010" y="401" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">cloud, managed identity</text>
<text x="996" y="438" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">Switch with one setting:</text>
<text x="996" y="456" font-size="12" font-weight="700" fill="#1E293B" text-anchor="start">LLM_PROVIDER</text>
<text x="996" y="484" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">Prompts are versioned files;</text>
<text x="996" y="500" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">every result names its model</text>
<text x="996" y="516" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">and prompt version.</text>
