<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LedgerLens architecture</title>
<desc id="d">Entry points (Review UI, CLI, API) feed a six-step agent workflow (ingest, parse, classify, extract, ground, validate) that calls a pluggable LLM provider layer and produces typed JSON in which every value has a page and bounding box. Data lives in PostgreSQL, Valkey and Azure Blob, Queue and Key Vault.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1280" height="900" rx="16" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0F172A" text-anchor="start">LedgerLens architecture</text>
<text x="40" y="80" font-size="14" font-weight="normal" fill="#475569" text-anchor="start">Financial documents in, validated JSON out. Every extracted number has a receipt: the page and box it was printed in.</text>
<rect x="860" y="34" width="22" height="16" rx="4" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="890" y="47" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Built</text>
