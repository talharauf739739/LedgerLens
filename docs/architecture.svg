<text x="1160" y="47" font-size="12.5" font-weight="normal" fill="#334155" text-anchor="start">Planned</text>
<rect x="40" y="110" width="250" height="610" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="56" y="136" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start">Entry points</text>
<rect x="58" y="156" width="214" height="62" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="72" y="179" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Review UI</text>
<text x="72" y="197" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">Streamlit: receipts on the page,</text>
<text x="72" y="212" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">corrections, approve / reject</text>
<rect x="58" y="232" width="214" height="52" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="72" y="255" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">CLI</text>
<text x="72" y="273" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">ledgerlens read | extract</text>
<rect x="58" y="306" width="214" height="52" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.6"/>
<text x="72" y="329" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">API clients</text>
<text x="72" y="347" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">developers, other systems</text>
<rect x="58" y="380" width="214" height="44" rx="10" fill="#F4F5F7" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="72" y="403" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Nginx</text>
<text x="124" y="407" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">TLS, 20 MB limit</text>
<rect x="58" y="446" width="214" height="66" rx="10" fill="#FFF7E6" stroke="#D97706" stroke-width="1.6"/>
<text x="72" y="469" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">FastAPI</text>
<text x="72" y="487" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">health checks built,</text>
<text x="72" y="502" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">/v1 documents + jobs planned</text>
<rect x="58" y="600" width="214" height="66" rx="10" fill="#F4F5F7" stroke="#9CA3AF" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="72" y="623" font-size="14" font-weight="600" fill="#0F172A" text-anchor="start">Queue worker</text>
<text x="72" y="641" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">async jobs, scales on</text>
<text x="72" y="656" font-size="11.5" font-weight="normal" fill="#475569" text-anchor="start">queue length</text>
<path d="M 165 358 L 165 378" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 165 424 L 165 444" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 165 512 L 165 598" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="174" y="559" font-size="11" font-weight="normal" fill="#334155" text-anchor="start" font-style="italic">via Azure Queue</text>
<rect x="320" y="110" width="630" height="300" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="338" y="136" font-size="13" font-weight="700" fill="#1E293B" text-anchor="start">Agent workflow</text>
<text x="338" y="152" font-size="11" font-weight="normal" fill="#64748B" text-anchor="start">Microsoft Agent Framework: a fixed graph, every step traced</text>
<rect x="338" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="383.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">1 Ingest</text>
<text x="383.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">images to</text>
<text x="383.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">PDF pages</text>
<path d="M 428 220 L 439 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="485.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">2 Parse</text>
<text x="485.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">text layer or</text>
<text x="485.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">RapidOCR,</text>
<text x="485.0" y="246" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">deskew, tables</text>
<path d="M 530 220 L 541 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="542" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="587.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">3 Classify</text>
<text x="587.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">keyword cues;</text>
<text x="587.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">LLM only if</text>
<text x="587.0" y="246" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">unsure</text>
<path d="M 632 220 L 643 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="644" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="689.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">4 Extract</text>
<text x="689.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">LLM copies</text>
<text x="689.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">printed values</text>
<text x="689.0" y="246" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">(no maths)</text>
<path d="M 734 220 L 745 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="746" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="791.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">5 Ground</text>
<text x="791.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">find every</text>
<text x="791.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">value on the</text>
<text x="791.0" y="246" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">page</text>
<path d="M 836 220 L 847 220" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="848" y="172" width="90" height="96" rx="10" fill="#ECFDF3" stroke="#16A34A" stroke-width="1.6"/>
<text x="893.0" y="196" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">6 Validate</text>
<text x="893.0" y="216" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">13 finance</text>
<text x="893.0" y="231" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">rules in</text>
<text x="893.0" y="246" font-size="11" font-weight="normal" fill="#475569" text-anchor="middle">Python</text>
<path d="M 791.0 268 L 791.0 294 L 689.0 294 L 689.0 270" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740.0" y="312" font-size="11" font-weight="normal" fill="#B45309" text-anchor="middle" font-style="italic">value not found: retry once</text>
<text x="338" y="352" font-size="12" font-weight="normal" fill="#1E293B" text-anchor="start">Agents propose, code decides: the LLM never does arithmetic or approves anything.</text>
<text x="338" y="372" font-size="12" font-weight="normal" fill="#1E293B" text-anchor="start">No receipt, no value: anything not found on the page is set to null and sent to review.</text>
<text x="338" y="392" font-size="12" font-weight="normal" fill="#1E293B" text-anchor="start">Document text is untrusted: instructions inside documents are ignored.</text>
<path d="M 272 187 L 318 187" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 272 258 L 318 258" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320" y="440" width="630" height="100" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
<text x="338" y="466" font-size="14" font-weight="700" fill="#0F172A" text-anchor="start">Result: typed JSON with receipts</text>
<text x="338" y="488" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">every value: value, page, bounding box, status (grounded / ungrounded / corrected)</text>
<text x="338" y="506" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">rule results (pass / fail per check), step trace, needs-review flag</text>
<text x="338" y="524" font-size="11.5" font-weight="normal" fill="#334155" text-anchor="start">back to the Review UI: a person corrects, approves or rejects</text>
<path d="M 893.0 268 L 893.0 438" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980" y="110" width="260" height="430" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
